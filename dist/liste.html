 <body data-template-id="__page-root" style="background: rgb(188, 143, 143);">
  <div class="cork-overlay"></div>
  <div id="empty-msg" class="empty-state">
   <h1 data-template-id="board-title" class="canva-text text-5xl mb-4" style="color: rgba(255, 255, 255, 0.9); font-weight: 400; font-style: normal; font-size: 32px;">La Mia Bacheca</h1>
   <p data-template-id="board-subtitle" class="canva-text text-xl" style="color: rgba(255, 255, 255, 0.8); font-weight: 400; font-style: normal; font-size: 20px;">Aggiungi una nota con il bottone in basso!</p>
  </div>
  <main id="board"></main><button id="add-btn" data-template-id="add-button" class="canva-button" title="Aggiungi una nota" style="background: rgb(214, 48, 49); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">+</button>
  <script src="/_sdk/719055fef2a85d14.editing_sdk.js" integrity="sha512-kFqrdGgIiTOsu307feB5Cy3JVP9IayftsmCIZ0csxYBGuBmJQPhyvcnmKR8F0fTW97h5s1gAvz3SumI8zJ6OxQ=="></script>
  <script>
        const board = document.getElementById('board');
        const addBtn = document.getElementById('add-btn');
        const emptyMsg = document.getElementById('empty-msg');

        let notes = JSON.parse(localStorage.getItem('corkboard_notes')) || [];
        const colors = [
            { bg: '#fff9c4', pin: '#e53935' },
            { bg: '#c8e6c9', pin: '#1e88e5' },
            { bg: '#bbdefb', pin: '#f4511e' },
            { bg: '#f8bbd0', pin: '#43a047' },
            { bg: '#e1bee7', pin: '#ffb300' }
        ];

        function init() {
            updateEmpty();
            notes.forEach(n => createNoteElement(n));

            addBtn.addEventListener('click', () => {
                const colorSet = colors[Math.floor(Math.random() * colors.length)];
                const newNote = {
                    id: Date.now(),
                    text: '',
                    color: colorSet.bg,
                    pinColor: colorSet.pin
                };
                notes.push(newNote);
                saveNotes();
                createNoteElement(newNote);
                updateEmpty();
            });
        }

        function updateEmpty() {
            emptyMsg.style.display = notes.length === 0 ? 'block' : 'none';
        }

        function createNoteElement(noteData) {
            const noteEl = document.createElement('div');
            noteEl.className = 'note';
            noteEl.style.backgroundColor = noteData.color;
            noteEl.dataset.id = noteData.id;

            noteEl.innerHTML = `
                <div class="pin" style="background-color: ${noteData.pinColor}"></div>
                <div class="note-header">
                    <div class="color-picker">
                        ${colors.map(c => `<div class="color-dot" style="background-color: ${c.bg}" data-color="${c.bg}" data-pin="${c.pin}"></div>`).join('')}
                    </div>
                    <span class="delete-btn" title="Rimuovi">&times;</span>
                </div>
                <textarea class="note-content" placeholder="Scrivi una nota...">${noteData.text}</textarea>
            `;

            const textarea = noteEl.querySelector('.note-content');
            textarea.addEventListener('input', (e) => {
                const idx = notes.findIndex(n => n.id == noteData.id);
                if (idx !== -1) { notes[idx].text = e.target.value; saveNotes(); }
            });

            noteEl.querySelector('.delete-btn').addEventListener('click', () => {
                noteEl.style.transform = 'scale(0) rotate(20deg)';
                noteEl.style.opacity = '0';
                setTimeout(() => {
                    noteEl.remove();
                    notes = notes.filter(n => n.id != noteData.id);
                    saveNotes();
                    updateEmpty();
                }, 200);
            });

            noteEl.querySelectorAll('.color-dot').forEach(dot => {
                dot.addEventListener('click', (e) => {
                    noteEl.style.backgroundColor = e.target.dataset.color;
                    noteEl.querySelector('.pin').style.backgroundColor = e.target.dataset.pin;
                    const idx = notes.findIndex(n => n.id == noteData.id);
                    if (idx !== -1) {
                        notes[idx].color = e.target.dataset.color;
                        notes[idx].pinColor = e.target.dataset.pin;
                        saveNotes();
                    }
                });
            });

            board.appendChild(noteEl);
        }

        function saveNotes() {
            localStorage.setItem('corkboard_notes', JSON.stringify(notes));
        }

        window.onload = init;
    </script>
