<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Reader Ultra - Zoom & Draw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        /* Contenitore principale che permette lo zoom nativo */
        #viewer-scroll-area {
            width: 100vw;
            height: calc(100vh - 120px);
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .page-wrapper {
            position: relative;
            background: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            /* Impedisce la selezione del testo durante il disegno */
            user-select: none;
            -webkit-user-select: none;
        }

        canvas { 
            display: block;
            width: 100% !important; 
            height: auto !important; 
        }

        .drawing-layer {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            /* Touch-action none è critico: impedisce lo scroll quando si disegna */
            touch-action: none; 
        }

        .drawing-layer.disabled {
            pointer-events: none;
            touch-action: auto;
        }

        /* Controlli flottanti in basso */
        .toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid #334155;
            padding: 15px;
            z-index: 100;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-action:active { transform: scale(0.95); }
        .btn-action:disabled { opacity: 0.3; }

        .status-pill {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #475569;
        }

        /* Stile per la modalità Dual Page su schermi grandi */
        @media (min-width: 1024px) {
            #spread-container {
                display: flex;
                flex-direction: row;
                gap: 10px;
                justify-content: center;
            }
            .page-wrapper { width: 45vw; }
        }
        @media (max-width: 1023px) {
            .page-wrapper { width: 92vw; }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Top Bar -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3">
            <input type="file" id="fileInput" accept="application/pdf" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="btn-action !bg-slate-700 !py-1 text-sm">
                📁 Apri
            </button>
            <div id="pageInfo" class="status-pill text-slate-300">Nessun file</div>
        </div>
        <div class="flex gap-2">
            <button id="prevBtn" class="bg-slate-800 p-2 rounded-full disabled:opacity-30">←</button>
            <button id="nextBtn" class="bg-slate-800 p-2 rounded-full disabled:opacity-30">→</button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main id="viewer-scroll-area">
        <div id="loading" class="hidden mt-20 text-slate-500 animate-pulse text-xl">Caricamento PDF...</div>
        
        <div id="spread-container">
            <!-- Pagina 1 -->
            <div id="containerLeft" class="page-wrapper hidden">
                <canvas id="pdfCanvasLeft"></canvas>
                <canvas id="drawCanvasLeft" class="drawing-layer disabled"></canvas>
            </div>
            <!-- Pagina 2 -->
            <div id="containerRight" class="page-wrapper hidden">
                <canvas id="pdfCanvasRight"></canvas>
                <canvas id="drawCanvasRight" class="drawing-layer disabled"></canvas>
            </div>
        </div>
    </main>

    <!-- Bottom Controls -->
    <nav class="toolbar">
        <div class="max-w-screen-xl mx-auto flex items-center justify-between gap-4">
            
            <div class="flex items-center gap-4">
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="drawMode" class="sr-only peer">
                    <div class="w-14 h-7 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-red-600"></div>
                    <span class="ml-3 text-sm font-medium">✍️ Scrivi</span>
                </label>
            </div>

            <div class="flex items-center gap-3">
                <input type="color" id="colorPicker" value="#ff3b3b" class="w-10 h-10 bg-transparent border-none cursor-pointer">
                <button id="clearBtn" class="text-xs text-red-400 font-bold uppercase tracking-tighter">Reset</button>
            </div>

        </div>
    </nav>
<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let annotations = {}; 
    let isDualPage = window.innerWidth >= 1024;

    const fileInput = document.getElementById('fileInput');
    const drawMode = document.getElementById('drawMode');
    const colorPicker = document.getElementById('colorPicker');
    const pageInfo = document.getElementById('pageInfo');
    const viewerArea = document.getElementById('viewer-scroll-area');

    // Ottimizzazione: Ricarica solo se necessario per non bloccare la memoria
    window.onresize = () => {
        const check = window.innerWidth >= 1024;
        if (check !== isDualPage) {
            isDualPage = check;
            renderSpread();
        }
    };

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('loading').classList.remove('hidden');
        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            pdfDoc = await pdfjsLib.getDocument({data: typedarray}).promise;
            currentPage = 1;
            annotations = {};
            renderSpread();
            document.getElementById('loading').classList.add('hidden');
        };
        reader.readAsArrayBuffer(file);
    };

    async function renderPage(pageNum, pdfCanvas, drawCanvas, container) {
        if (!pdfDoc || pageNum > pdfDoc.numPages || pageNum < 1) {
            container.classList.add('hidden');
            return;
        }
        container.classList.remove('hidden');

        const page = await pdfDoc.getPage(pageNum);
        // Scala 2.0: il miglior compromesso per non far bloccare i comandi
        const viewport = page.getViewport({ scale: 2.0 });
        
        pdfCanvas.width = drawCanvas.width = viewport.width;
        pdfCanvas.height = drawCanvas.height = viewport.height;

        const ctx = pdfCanvas.getContext('2d', { alpha: false });
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        redrawAnnotations(pageNum, drawCanvas);
        setupCanvasInteraction(pageNum, drawCanvas);
    }

    async function renderSpread() {
        if (!pdfDoc) return;
        await renderPage(currentPage, document.getElementById('pdfCanvasLeft'), document.getElementById('drawCanvasLeft'), document.getElementById('containerLeft'));
        if (isDualPage && currentPage + 1 <= pdfDoc.numPages) {
            await renderPage(currentPage + 1, document.getElementById('pdfCanvasRight'), document.getElementById('drawCanvasRight'), document.getElementById('containerRight'));
            pageInfo.textContent = `Pagine ${currentPage}-${currentPage + 1} / ${pdfDoc.numPages}`;
        } else {
            document.getElementById('containerRight').classList.add('hidden');
            pageInfo.textContent = `Pagina ${currentPage} / ${pdfDoc.numPages}`;
        }
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = (isDualPage ? currentPage + 1 : currentPage) >= pdfDoc.numPages;
    }

    function setupCanvasInteraction(pageNum, canvas) {
        const ctx = canvas.getContext('2d');
        let isPainting = false;

        // Funzione di calcolo posizione velocizzata
        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        };

        canvas.onmousedown = (e) => {
            if (!drawMode.checked) return;
            isPainting = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if (!annotations[pageNum]) annotations[pageNum] = [];
            annotations[pageNum].push({ ...pos, color: colorPicker.value, isNew: true });
        };

        canvas.onmousemove = (e) => {
            if (!isPainting || !drawMode.checked) return;
            const pos = getPos(e);
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.strokeStyle = colorPicker.value;
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            annotations[pageNum].push({ ...pos, color: colorPicker.value, isNew: false });
        };

        const stop = () => { isPainting = false; };
        window.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', (e) => canvas.onmousedown(e), { passive: false });
        canvas.addEventListener('touchmove', (e) => { if(isPainting) e.preventDefault(); canvas.onmousemove(e); }, { passive: false });
        canvas.addEventListener('touchend', stop);
    }

    function redrawAnnotations(pageNum, canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const data = annotations[pageNum];
        if (!data) return;
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        data.forEach((p) => {
            ctx.strokeStyle = p.color;
            if (p.isNew) { ctx.beginPath(); ctx.moveTo(p.x, p.y); }
            else { ctx.lineTo(p.x, p.y); ctx.stroke(); }
        });
    }

    drawMode.onchange = () => {
        document.querySelectorAll('.drawing-layer').forEach(l => {
            l.classList.toggle('disabled', !drawMode.checked);
        });
        document.body.style.touchAction = drawMode.checked ? 'none' : 'auto';
    };

    document.getElementById('prevBtn').onclick = () => {
        currentPage = Math.max(1, currentPage - (isDualPage ? 2 : 1));
        renderSpread();
    };

    document.getElementById('nextBtn').onclick = () => {
        currentPage = Math.min(pdfDoc.numPages, currentPage + (isDualPage ? 2 : 1));
        renderSpread();
    };

    document.getElementById('clearBtn').onclick = () => {
        annotations[currentPage] = [];
        if (isDualPage) annotations[currentPage + 1] = [];
        renderSpread();
    };
</script>

   
        
</body>
</html>
