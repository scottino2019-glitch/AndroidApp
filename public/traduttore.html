<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traduttore Pro Google Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 100%; margin: 0 auto; }
        textarea { resize: none; border: none; background: transparent; }
        textarea:focus { outline: none; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4F46E5;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .rtl { direction: rtl; text-align: right; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-2 sm:p-4">

    <div class="app-container bg-white min-h-[90vh] rounded-[2.5rem] shadow-2xl border border-gray-100 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 shadow-lg">
            <div class="flex justify-between items-center">
                <h1 class="text-white text-xl font-bold tracking-tight">Global Translator</h1>
                <span class="bg-indigo-400 text-white text-[10px] px-2 py-1 rounded-full uppercase font-black">Google Engine</span>
            </div>
        </div>

        <div class="p-5 flex-grow space-y-5">
            
            <!-- Selettore Lingue -->
            <div class="flex items-center bg-gray-50 p-1 rounded-2xl border border-gray-100 shadow-sm">
                <select id="langFrom" class="flex-1 bg-transparent text-sm font-bold text-gray-600 p-3 outline-none cursor-pointer">
                    <option value="auto">Rileva lingua</option>
                    <option value="it" selected>Italiano</option>
                    <option value="en">Inglese</option>
                    <option value="fr">Francese</option>
                    <option value="es">Spagnolo</option>
                    <option value="de">Tedesco</option>
                    <option value="ru">Russo</option>
                    <option value="ar">Arabo</option>
                    <option value="tr">Turco</option>
                    <option value="hi">Hindi</option>
                    <option value="th">Thai</option>
                    <option value="zh-CN">Cinese</option>
                    <option value="ko">Coreano</option>
                    <option value="ja">Giapponese</option>
                </select>

                <button onclick="swapLanguages()" class="p-2 bg-white rounded-xl shadow-sm text-indigo-600 active:scale-90 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                </button>

                <select id="langTo" class="flex-1 bg-transparent text-sm font-bold text-gray-600 p-3 outline-none cursor-pointer text-right">
                    <option value="en">Inglese</option>
                    <option value="it">Italiano</option>
                    <option value="zh-CN" selected>Cinese</option>
                    <option value="ja">Giapponese</option>
                    <option value="ru">Russo</option>
                    <option value="ar">Arabo</option>
                    <option value="ko">Coreano</option>
                    <option value="fr">Francese</option>
                    <option value="de">Tedesco</option>
                    <option value="tr">Turco</option>
                    <option value="hi">Hindi</option>
                    <option value="th">Thai</option>
                </select>
            </div>

            <!-- Input Area -->
            <div class="relative bg-white rounded-3xl p-4 border-2 border-gray-50 shadow-inner group focus-within:border-indigo-100 transition-colors">
                <textarea id="inputText" placeholder="Inserisci testo..." class="w-full h-32 text-gray-800 text-xl font-medium"></textarea>
                <div class="flex justify-between items-center mt-2">
                    <span id="charCount" class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">0 caratteri</span>
                    <button onclick="clearText()" class="p-2 text-gray-300 hover:text-red-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Pulsante Traduci -->
            <button onclick="translateText()" id="btnTranslate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-indigo-100 flex items-center justify-center gap-3 active:scale-[0.97] transition-all">
                <span class="uppercase tracking-widest text-sm">Traduci ora</span>
                <div id="loader" class="loader"></div>
            </button>

            <!-- Risultato -->
            <div id="resultContainer" class="hidden fade-in space-y-2">
                <div class="flex justify-between items-center px-2">
                    <label class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">Risultato</label>
                    <button onclick="copyToClipboard()" class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 active:bg-indigo-200">
                        Copia
                    </button>
                </div>
                <div id="outputText" class="w-full min-h-[140px] p-6 bg-gradient-to-br from-indigo-50 to-blue-50 border border-indigo-100 rounded-[2rem] text-indigo-900 text-xl font-semibold leading-relaxed"></div>
            </div>

        </div>

        <div class="p-6 text-center bg-gray-50/50">
            <p class="text-[9px] text-gray-400 font-bold tracking-[0.2em] uppercase">Powered by High-Precision Engine</p>
        </div>
    </div>

    <script>
        // Gestione conteggio caratteri
        document.getElementById('inputText').addEventListener('input', function() {
            document.getElementById('charCount').innerText = this.value.length + " caratteri";
        });

        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const from = document.getElementById('langFrom').value;
            const to = document.getElementById('langTo').value;
            const outputDiv = document.getElementById('outputText');
            const resultContainer = document.getElementById('resultContainer');
            const loader = document.getElementById('loader');
            const btnText = document.querySelector('#btnTranslate span');

            if (!text) return;

            loader.style.display = 'block';
            btnText.style.opacity = '0.5';
            
            try {
                // Motore Google Translate (GTX)
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
                
                const response = await fetch(url);
                const data = await response.json();

                // Il formato di Google è un array nidificato: data[0][0][0] contiene la traduzione principale
                if (data && data[0]) {
                    let translatedText = "";
                    data[0].forEach(part => {
                        if (part[0]) translatedText += part[0];
                    });

                    // Supporto Lingue RTL
                    if (to === 'ar') outputDiv.classList.add('rtl');
                    else outputDiv.classList.remove('rtl');

                    outputDiv.innerText = translatedText;
                    resultContainer.classList.remove('hidden');
                    
                    // Scroll fluido verso il risultato
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }
            } catch (error) {
                console.error(error);
                alert("Errore nella traduzione. Verifica la connessione.");
            } finally {
                loader.style.display = 'none';
                btnText.style.opacity = '1';
            }
        }

        function swapLanguages() {
            const langFrom = document.getElementById('langFrom');
            const langTo = document.getElementById('langTo');
            if (langFrom.value === 'auto') return;
            const temp = langFrom.value;
            langFrom.value = langTo.value;
            langTo.value = temp;
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('charCount').innerText = "0 caratteri";
            document.getElementById('resultContainer').classList.add('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('outputText').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            // Feedback visivo rapido
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            btn.innerText = "Copiato!";
            setTimeout(() => btn.innerText = originalText, 1500);
        }
    </script>
</body>
</html>
