<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Studio Safe Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- LIBRERIE LOCALI -->
    <script src="pdf.min.js"></script>

    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #1a1a1b; font-family: sans-serif; overflow: hidden; }
        header { background: #2d2d2e; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 10; }
        
        #pdf-viewport { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #1a1a1b;
            padding-top: 10px;
        }

        canvas { 
            max-width: 98% !important; 
            height: auto !important; 
            margin-bottom: 15px; 
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #editor-container { 
            height: 35vh; 
            background: #fff; 
            border-top: 3px solid #6366f1;
            display: flex;
            flex-direction: column;
        }

        #notepad { 
            flex: 1; width: 100%; border: none; outline: none; padding: 12px;
            font-size: 16px; resize: none; color: #111; line-height: 1.5;
        }

        .status-bar { background: #2d2d2e; color: #aaa; font-size: 9px; padding: 2px 10px; text-transform: uppercase; display: flex; justify-content: space-between; }
        .btn { background: #6366f1; color: white; padding: 8px 15px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; }
        .error-box { color: #ff4d4d; font-size: 10px; max-width: 150px; overflow: hidden; }
    </style>
</head>
<body>

    <header>
        <label class="btn cursor-pointer">
            Carica PDF
            <input type="file" id="file-input" accept="application/pdf" class="hidden">
        </label>
        <div class="flex flex-col items-end">
            <span id="page-indicator" class="text-white text-[10px] font-bold">PAGINA: 0 / 0</span>
            <div id="error-log" class="error-box"></div>
        </div>
    </header>

    <div id="pdf-viewport">
        <div id="msg" class="text-gray-500 mt-10 text-center text-sm">Nessun documento caricato</div>
    </div>

    <div class="status-bar">
        <span>Salvataggio note automatico</span>
        <span id="render-status">Pronto</span>
    </div>

    <div id="editor-container">
        <textarea id="notepad" placeholder="Scrivi qui i tuoi appunti..."></textarea>
    </div>

    <script>
        // Configurazione PDF.js Locale
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const viewport = document.getElementById('pdf-viewport');
        const notepad = document.getElementById('notepad');
        const renderStatus = document.getElementById('render-status');
        const errorLog = document.getElementById('error-log');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            renderStatus.textContent = "Lettura file...";
            errorLog.textContent = "";

            reader.onload = function() {
                const data = new Uint8Array(this.result);
                startPDFEngine(data);
            };
            reader.onerror = (e) => alert("Errore lettura file: " + e);
            reader.readAsArrayBuffer(file);
        });

        async function startPDFEngine(uint8Data) {
            try {
                viewport.innerHTML = '';
                renderStatus.textContent = "Avvio motore...";

                // Parametri di caricamento ultra-sicuri per PDF scansionati
                const loadingTask = pdfjsLib.getDocument({
                    data: uint8Data,
                    disableRange: true,      // Importante per file locali
                    disableStream: true,     // Evita problemi di memoria nel buffer
                    disableAutoFetch: true,  // Carica solo ciò che serve
                    isEvalSupported: false   // Più sicuro per WebView
                });

                const pdf = await loadingTask.promise;
                document.getElementById('page-indicator').textContent = `PAGINA: 1 / ${pdf.numPages}`;
                
                // RENDERING SEQUENZIALE
                for (let n = 1; n <= pdf.numPages; n++) {
                    renderStatus.textContent = `Rendering Pag. ${n}...`;
                    try {
                        await renderOnePage(pdf, n);
                    } catch (e) {
                        console.error("Errore pagina " + n, e);
                        const errDiv = document.createElement('div');
                        errDiv.className = "text-red-500 p-10 text-xs";
                        errDiv.textContent = `Impossibile caricare Pagina ${n}`;
                        viewport.appendChild(errDiv);
                    }
                }
                renderStatus.textContent = "Completato";

            } catch (err) {
                renderStatus.textContent = "Errore Critico";
                errorLog.textContent = err.message;
                alert("Errore PDF: " + err.message);
            }
        }

        async function renderOnePage(pdf, num) {
            const page = await pdf.getPage(num);
            
            // LIMITA RISOLUZIONE PER PDF SCANSIONATI
            // Se la scansione è enorme, la scaliamo forzatamente per salvare memoria
            const rawViewport = page.getViewport({ scale: 1.0 });
            
            // Calcolo scale: cerchiamo di stare intorno ai 1000px di larghezza
            let safeScale = 1.0;
            if (rawViewport.width > 1000) {
                safeScale = 1000 / rawViewport.width;
            }
            
            // Su mobile, se la RAM è poca, meglio scalare ancora un po'
            if (window.innerWidth < 600) safeScale *= 0.8;

            const vp = page.getViewport({ scale: safeScale });
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { 
                alpha: false, 
                willReadFrequently: false 
            });

            canvas.width = vp.width;
            canvas.height = vp.height;
            viewport.appendChild(canvas);

            await page.render({
                canvasContext: ctx,
                viewport: vp,
                intent: 'display' // Forza il rendering per visualizzazione
            }).promise;
            
            // Aiutiamo il Garbage Collector
            page.cleanup();
        }

        // --- GESTIONE NOTE ---
        window.onload = () => {
            const saved = localStorage.getItem('_my_notes_save');
            if (saved) notepad.value = saved;
        };

        notepad.addEventListener('input', () => {
            localStorage.setItem('_my_notes_save', notepad.value);
        });

        // Tracker Pagina
        viewport.addEventListener('scroll', () => {
            const canvases = viewport.getElementsByTagName('canvas');
            for (let i = 0; i < canvases.length; i++) {
                const rect = canvases[i].getBoundingClientRect();
                if (rect.top > -100 && rect.top < 300) {
                    const total = document.getElementById('page-indicator').textContent.split('/')[1];
                    document.getElementById('page-indicator').textContent = `PAGINA: ${i + 1} / ${total}`;
                    break;
                }
            }
        });
    </script>
</body>
</html>
