<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer & Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Caricamento PDF.js -->
    <script src="pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #e5e7eb; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Viewer PDF */
        #pdf-container { flex: 1; overflow: auto; background: #525659; display: flex; flex-direction: column; align-items: center; padding: 10px; border-bottom: 4px solid #4F46E5; }
        canvas { max-width: 100%; height: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 15px; border-radius: 4px; }

        /* Notepad */
        #notepad-container { height: 35vh; background: #fff; padding: 15px; display: flex; flex-direction: column; position: relative; }
        #notepad { width: 100%; height: 100%; border: none; resize: none; outline: none; font-size: 16px; line-height: 1.5; color: #374151; background-image: linear-gradient(#f1f1f1 1px, transparent 1px); background-size: 100% 1.5rem; }
        
        .floating-tools { position: absolute; top: -25px; right: 20px; display: flex; gap: 10px; }
        .tool-btn { background: #4F46E5; color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Scrollbar sottile */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Header / Carica PDF -->
    <header class="bg-white p-3 flex justify-between items-center shadow-md z-10">
        <label class="flex items-center gap-2 cursor-pointer bg-indigo-50 px-4 py-2 rounded-xl text-indigo-600 border border-indigo-200 active:scale-95 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span class="text-sm font-bold uppercase tracking-tighter">Carica PDF</span>
            <input type="file" id="file-input" accept="application/pdf" class="hidden">
        </label>
        <div id="page-info" class="text-xs font-bold text-gray-500 uppercase tracking-widest hidden">
            Pagina: <span id="page-num">0</span> / <span id="page-count">0</span>
        </div>
    </header>

    <!-- Visualizzatore PDF -->
    <div id="pdf-container">
        <div id="placeholder-msg" class="text-gray-400 mt-20 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Seleziona un documento PDF per iniziare
        </div>
    </div>

    <!-- Sezione Note (Notepad) -->
    <div id="notepad-container">
        <div class="floating-tools">
            <button onclick="clearNotes()" class="tool-btn bg-red-500">Cancella</button>
            <button onclick="downloadNotes()" class="tool-btn">Scarica .txt</button>
        </div>
        <div class="flex items-center gap-2 mb-2">
            <span class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">I tuoi appunti (Salvataggio automatico)</span>
        </div>
        <textarea id="notepad" placeholder="Scrivi qui i tuoi appunti mentre leggi..."></textarea>
    </div>

    <script>
        // --- CONFIGURAZIONE PDF.JS ---
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
        let pdfDoc = null;
        const container = document.getElementById('pdf-container');
        const fileInput = document.getElementById('file-input');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file && file.type === "application/pdf") {
                const reader = new FileReader();
                reader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    loadPDF(typedarray);
                };
                reader.readAsArrayBuffer(file);
            }
        });

        async function loadPDF(data) {
            document.getElementById('placeholder-msg').classList.add('hidden');
            document.getElementById('page-info').classList.remove('hidden');
            container.innerHTML = ''; // Pulisci precedente

            pdfDoc = await pdfjsLib.getDocument(data).promise;
            document.getElementById('page-count').textContent = pdfDoc.numPages;

            // Renderizza tutte le pagine una dopo l'altra (stile scroll continuo)
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                renderPage(i);
            }
        }

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };
            
            container.appendChild(canvas);
            await page.render(renderContext);

            // Aggiorna numero pagina corrente durante lo scroll
            container.onscroll = () => {
                const canvases = container.getElementsByTagName('canvas');
                for (let j = 0; j < canvases.length; j++) {
                    const rect = canvases[j].getBoundingClientRect();
                    if (rect.top >= 0 && rect.top <= window.innerHeight / 2) {
                        document.getElementById('page-num').textContent = j + 1;
                        break;
                    }
                }
            };
        }

        // --- GESTIONE NOTEPAD ---
        const notepad = document.getElementById('notepad');

        // Carica note salvate all'avvio
        window.onload = () => {
            const savedNotes = localStorage.getItem('pdf_notes');
            if (savedNotes) notepad.value = savedNotes;
        };

        // Salvataggio automatico ogni volta che l'utente scrive
        notepad.addEventListener('input', () => {
            localStorage.setItem('pdf_notes', notepad.value);
        });

        function clearNotes() {
            if (confirm("Vuoi cancellare tutte le note?")) {
                notepad.value = '';
                localStorage.removeItem('pdf_notes');
            }
        }

        function downloadNotes() {
            const text = notepad.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = "appunti_pdf.txt";
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
        }
    </script>
</body>
</html>
